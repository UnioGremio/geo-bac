    {id:"concert",icon:"\ud83c\udf0d",title:"Concertul European și Problema Orient\u0103rit\u0103",short:"Marile puteri, Eastern Question, sistemul diplomatic",content:[
      {t:"Sistemul Concert of Europe (1815\u20131914)",d:"«Concertul Europei» — sistemul diplomatic stabilit prin Congresul de la Viena (1814\u20131815) care organiza relațiile dintre marile puteri (Anglia, Austria, Prusia, Rusia, ulterior Franța) pe baza echilibrului de putere și consultărilor periodice. Congrесele periodice: Aachen (1818), Troppau (1820), Laibach (1821), Verona (1822) — principiul intervenției colective pentru stingerea revoluțiilor. Problema Orientală (Eastern Question): Declinul Imperiului Otoman genera «vidul de putere» care atrăgea marile puteri. Rusia dorea acces la Mediterana și protectorat asupra creștinilor ortodocși. Austria dorea să blocheze expansiunea rusă în Balcani. Anglia voia să mențină Imperiul Otoman ca tampon față de Rusia. Franța voia influență în Levant. România se afla în centrul acestei chestiuni — controlul gurilor Dunăreii era miză strategică crucială."},
      {t:"Congresul de la Paris (1856) — Consecințe",d:"Tratatul de la Paris (30 martie 1856) a restructurat fundamental relațiile internaționale pontice: (1) Neutralizarea Mării Negre — flota militară a tuturor puterilor interzisă; (2) Libertatea navigației pe Dunăre — Comisia Europeana a Dunăreii la Galați; (3) Principatele sub garanție colectivă a 7 puteri (nu mai doar protectorat rusesc); (4) Retrocedarea sudului Basarabiei (Bolgrad, Cahul, Ismail) Moldovei; (5) Autonomia Principatelor garantată international. Importanța pentru România: Ieșirea de sub protectoratul rus exclusiv și intrarea în sistemul de garanții europene colective — primul pas spre recunoașterea internațională ca entitate distinctă."},
      {t:"Alianțele Europene și Poziția României",d:"Tripla Alianță (1882): Germania, Austro-Ungaria, Italia — România aderă secret în 1883 (Tratatul cu Austro-Ungaria, semnat și de Germania). Tripla Antantă: Franța, Marea Britanie, Rusia — conturată 1907. România — în poziție delicată: tratat secret cu Puterile Centrale, dar aspirații naționale (Transilvania, Bucovina) incompatibile cu Austro-Ungaria. Neutralitate 1914\u20131916: Declarată în august 1914, România a negociat cu ambele tabere. Tratatul de la București (4/17 august 1916): România intră în war alături de Antantă contra promisiunilor de Transilvania, Bucovina, Banat."},
    ]},
    {id:"wwi",icon:"\u2694\ufe0f",title:"România în Primul Război Mondial (1916\u20131918)",short:"Campania 1916, Mărășești, Pacea de la București, revenirea",content:[
      {t:"Intrarea în Război și Campania din 1916",d:"Tratatul de la București (4/17 august 1916) cu Antanta: România intră în war contra Austro-Ungariei și Germaniei. Armata română (circa 650.000 de osteni) invadează Transilvania la 14/27 august 1916 pe mai multe direcții. Succese inițiale: cucerirea Brașovului, Sibiului, avansul spre Cluj. Contraatacul (sept.\u2013nov. 1916): Armata germano-bulgaro-turcă (sub Mackensen) atacă din sud prin Dobrogea; armata germano-austro-ungară (sub Falkenhayn) contraatacă din Transilvania. Bătălia de la Neajlov\u2013Argeș (17\u201320 nov. 1916): Eșecul ultimei tentative de apărare a Bucureștiului. La 23 nov./6 dec. 1916, trupele germane intră în București."},
      {t:"Vara Eroică (1917) — Mărăști, Mărășești, Oituz",d:"Guvernul și armata s-au retras în Moldova — singura parte neocupată. Iași devine capitală provizorie (dec. 1916\u2013nov. 1918). Refacerea armatei cu instructori francezi (misiunea generalului Berthelot, sosită dec. 1916). Bătălia de la Mărăști (11\u201319 iul. 1917): Contraofensivă românescă — recuperare de 30 km în adâncime, generalul Eremia Grigorescu. Bătălia de la Mărășești (24 iul./6 aug. \u2013 3/16 sept. 1917): «Verdunul României» — armata română a respins ofensiva germano-austro-ungară. Circa 27.000 de morți, răniți și dispăruți pe ambele tabere. Inscripția monumentului: «Aici a oprit valul dușman cotropitor vitejia ostașilor români.» Bătălia de la Oituz (26 iul.\u201322 aug. 1917): Apărarea trecătorii Oituz."},
      {t:"Marea Unire din 1918 — Etapele",d:"Unirea Basarabiei (27 mart./9 apr. 1918): Sfatul Țării votează \u2014 86 voturi pentru, 3 contra, 36 abțineri. La 25 nov./8 dec. 1918, unirea necondiționată. Unirea Bucovinei (15/28 nov. 1918): Congresul General al Bucovinei, Cernăuți \u2014 unanimitate. Unirea Transilvaniei (1/14 dec. 1918): Marea Adunare de la Alba Iulia \u2014 circa 100.000 de participanți. Rezoluția: «Adunarea Națională a tuturor românilor din Transilvania, Banat și Ungaria...hotărăște unirea acelor români și a tuturor teritoriilor locuite de dânșii cu România.» Regele Ferdinand I și Regina Maria intră în Cluj la 24 dec. 1918/6 ian. 1919."},
    ]},
    {id:"paris1919",icon:"\ud83d\udcdc",title:"Conferința de Pace (1919\u20131920) și Liga Națiunilor",short:"Wilson, 14 puncte, Trianon, Titulescu",content:[
      {t:"Conferința de Pace și Principiile Wilsoniene",d:"Conferința de Pace de la Paris (18 ian. 1919 \u2013 21 ian. 1920) a restructurat harta Europei după WWI. Președintele american Woodrow Wilson \u2014 «14 Puncte» (8 ian. 1918): autodeterminare națională, diplomație deschisă, Liga Națiunilor. Tratatul de la Trianon (4 iun. 1920): Cu Ungaria \u2014 recunoașterea internațională a Transilvaniei, Banatului, Crișanei, Maramureșului ca parte a României. Ungaria pierdea 2/3 din teritoriul anterior. Tratatul de la Saint-Germain (10 sept. 1919): Cu Austria \u2014 Bucovina recunoscută. Tratatul de la Neuilly (27 nov. 1919): Cu Bulgaria \u2014 Dobrogea recunoscută."},
      {t:"Liga Națiunilor și Titulescu",d:"Liga Națiunilor (fondată 1919, Geneva) \u2014 prima organizație de securitate colectivă. România \u2014 membră fondatoare. Nicolae Titulescu (1882\u20131941) \u2014 cel mai important diplomat român interbelic: Președinte al Adunării Generale a Ligii (1930, 1931); Mica Înțelegere (1920\u20131921): România, Cehoslovacia, Iugoslavia \u2014 alianță defensivă față de revizionismul ungar. Înțelegerea Balcanică (9 febr. 1934): România, Iugoslavia, Grecia, Turcia. Cedările teritoriale din 1940: Basarabia și N. Bucovinei (iun. 1940, URSS), N. Transilvaniei (aug. 1940, Arbitrajul de la Viena), Cadrilaterul (sept. 1940, Bulgaria)."},
    ]},
    {id:"cron5",icon:"\ud83d\udcdc",title:"Cronologie: România și Concertul European (1856\u20131920)",short:"Date verificate",content:[
      {t:"1856\u20131918: De la Paris la Unire",d:"1856, 30 mart. — Tratatul de la Paris; protectorat colectiv. 1858, 7/19 aug. — Convenția de la Paris. 1859, 5/17 ian. și 24 ian./5 febr. — Dubla alegere a lui Cuza. 1866, 29 iun./11 iul. — Constituția României. 1877, 9/21 mai — Proclamarea independenței. 1877, 30 aug./11 sept. — Grivița. 1877, 28 nov./10 dec. — Plevna capitulează. 1878, 1\u201313 iun.\u20131\u201313 iul. — Congresul de la Berlin. 1881, 14/26 mart. — Regatul României. 1883, 18 oct. — Tratatul secret cu Tripla Alianță. 1914, aug. — Neutralitate. 1916, 4/17 aug. — Tratatul de la București; intrarea în war. 1916, 23 nov./6 dec. — Ocuparea Bucureștiului. 1917, iul.\u2013aug. — Mărăști, Mărășești, Oituz. 1918, 27 mart. — Unirea Basarabiei. 1918, 15/28 nov. — Unirea Bucovinei. 1918, 1/14 dec. — Marea Adunare de la Alba Iulia. 1920, 4 iun. — Tratatul de la Trianon."},
    ]},
  ];

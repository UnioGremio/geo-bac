      {t:"Tehnica «Salamiului» și Preluarea Puterii",d:"PCR (circa 1.000 de membri în aug. 1944) a preluat puterea gradual: (1) Aug.\u2013dec. 1944: Portofolii cheie (interne, justiție) în guvernele Sănătescu și Rădescu; (2) 6 mart. 1945: Guvernul Petru Groza instalat sub presiunea sovietică (generalul Vâșinski); (3) Nov. 1946: Alegeri fraudate — BPD declarat câștigător cu 70% (sondajele independente indicau circa 70% pentru PNȚ); (4) 30 dec. 1947: Abdicarea forțată a Regelui Mihai I; Republica Populară Română."},
      {t:"Naționalizarea, Colectivizarea și Represiunea",d:"Naționalizarea (11 iun. 1948): Legea nr. 119 naționalizează circa 8.894 de întreprinderi — proprietarii privați pierd proprietăți fără compensație. Colectivizarea (1949\u20131962): Model sovietic; circa 96% din terenul agricol în GAC-uri și IAS-uri până în 1962 — ultima țară din lagăr care finalizează colectivizarea. Represiunea (1948\u20131964): Pitești (1949\u20131952: experiment unic de «reeducare prin tortură»); Sighet (cel puțin 60 de morți, inclusiv foști prim-miniștri și episcopi greco-catolici); Canal (80.000\u2013100.000 deținuți, circa 10.000\u201315.000 morți). Total deținuți politici estimat: 80.000\u2013200.000."},
    ]},
    {id:"dej",icon:"\ud83d\udcd6",title:"Regimul Gheorghiu-Dej (1948\u20131965)",short:"Stalinism, destalinizare, Declarația din 1964",content:[
      {t:"Gheorghe Gheorghiu-Dej — Politica Independenței",d:"Dej (1901\u20131965) — a eliminat sistematic rivalii: Ana Pauker, Vasile Luca, Teohari Georgescu (1952); Iosif Chișinevschi, Miron Constantinescu (1957). A profitat de conflictul sino-sovietic (1960+) pentru autonomie față de Moscova. Retragerea trupelor sovietice (1958). Declarația din Aprilie 1964: Dreptul fiecărui partid de a-și urma «calea proprie»; respingerea subordonării față de orice centru extern. Amnistia deținuților politici (Decretul nr. 176, 23 iun. 1964): circa 10.000\u201311.000 eliberați (unii după 15\u201318 ani de detenție)."},
    ]},
    {id:"ceausescu",icon:"\ud83c\udfc6",title:"Regimul Ceaușescu (1965\u20131989)",short:"Nationalism comunist, Securitatea, megalomanie, Revoluție",content:[
      {t:"Ascensiunea și Momentele de Popularitate",d:"Nicolae Ceaușescu (1918\u20131989) preia conducerea PCR la 19 mart. 1965. Momente de popularitate: (1) Condamnarea invaziei Cehoslovaciei (21 aug. 1968) \u2014 discursul din balconul CC; circa 100.000 în Piața Palatului; (2) Vizita Președintelui Nixon (1969); (3) Admiterea în FMI și Banca Mondială (1972); (4) Jocurile Olimpice de la Los Angeles (1984) \u2014 România participă, deși URSS boicotează."},
      {t:"Politicile Obsesive și Securitatea",d:"Plata datoriei externe (circa 3 mld. USD/an din export, cu reducerea drastică a consumului intern: rații, energie 2\u20133 ore/zi, frig). Decretul 770/1966 (interzicerea avortului): circa 9.000\u201310.000 femei moarte din cauza avorturilor ilegale (1966\u20131989). Sistematizarea satelor (1988): Plan de demolare a circa 7.000 de sate; implementat parțial. Securitatea (DSS): circa 400.000\u2013700.000 de informatori dintr-o populație de 22 milioane. Disidenți: Paul Goma, Doina Cornea, Mircea Dinescu, László Tőkés."},
      {t:"Revoluția din Decembrie 1989",d:"Timișoara (16\u201317 dec. 1989): Revolte pornite de la apărarea pastorului László Tőkés; circa 73\u2013100 de morți. La 20 dec. — Timișoara, «primul oraș liber din România». București (21\u201325 dec. 1989): Ultimul discurs (21 dec.) — huiduieli; Ceaușescu fuge (22 dec.); judecat și executat (25 dec.). Bilanț: circa 1.104 morți. Singura revoluție violentă din blocul sovietic."},
    ]},
    {id:"razboirece",icon:"\ud83c\udf0d",title:"România și Războiul Rece",short:"CAER, Pactul de la Varșovia, pozitia specială",content:[
      {t:"Poziția Specială a României",d:"România a aderat la CAER (1949) și Pactul de la Varșovia (14 mai 1955). Trupele sovietice retrase (1958). Politică externă distinctă: recunoașterea RFG (1967); menținerea relațiilor cu Israel după 1967; relații cu China; admiterea în FMI și Banca Mondială (1972); participarea la Jocurile Olimpice de la Los Angeles (1984). Contradicția: Politica externă independentă nu a înmoit regimul intern \u2014 represiunea a continuat și s-a intensificat în anii 1980."},
    ]},
    {id:"cron7",icon:"\ud83d\udcdc",title:"Cronologie: România Postbelică (1944\u20131989)",short:"Date verificate",content:[
      {t:"1944\u20131989: Sub Cortina de Fier",d:"1944, 23 aug. — Actul de la 23 August. 1945, 6 mart. — Guvernul Petru Groza. 1946, 7 nov. — Alegeri fraudate. 1947, 30 dec. — Abdicarea Regelui Mihai I; RPR. 1948, 13 apr. — Constituția RPR. 1948, 11 iun. — Naționalizarea. 1948, aug. — Dizolvarea Bisericii Greco-Catolice. 1949\u20131952 — Experimentul de la Pitești. 1949\u20131962 — Colectivizarea. 1950\u20131953 — Canalul. 1955, 14 mai — Pactul de la Varșovia. 1958 — Retragerea trupelor sovietice. 1964, 23 iun. — Amnistia politică. 1964, apr. — Declarația de Independență a PCR. 1965, 19 mart. — Moartea lui Dej; Ceaușescu. 1965, iul. — RSR. 1966 — Decretul 770. 1968, 21 aug. — Condamnarea invaziei Cehoslovaciei. 1972 — FMI și Banca Mondială. 1974 — Ceaușescu \u2014 Președinte RSR. 1977, aug. — Greva minerilor din Valea Jiului. 1982\u20131989 — Austeritate extremă; rambursarea datoriei. 1987, 15 nov. — Revolta de la Brașov. 1989, 16 dec. — Timișoara. 1989, 22 dec. — Căderea lui Ceaușescu. 1989, 25 dec. — Execuția. Bilanț: circa 1.104 morți."},

    {id:"const1923",icon:"\ud83d\udcdc",title:"Constitu\u021bia din 1923 \u0219i Via\u021ba Democratic\u0103",short:"Vot universal, partide, reform\u0103 agrar\u0103",content:[
      {t:"Constituția din 29 martie 1923",d:"Adoptată de Parlamentul ales în nov. 1922 (majoritate liberală). Principalele inovații: (1) Vot universal masculin (art. 64) — abolirea colegiilor censitare; (2) România declarată «stat național, unitar și indivizibil» (art. 1); (3) Garantarea proprietății private cu posibilitate de expropriere «pentru utilitate publică»; (4) Libertăți fundamentale extinse; (5) Controlul constituționalității prin Curtea de Casație (secțiile unite). Una dintre cele mai avansate constituții europene ale epocii interbelice. Suspendată de Carol II (1938); abrogată prin Constituția RPR din 1948."},
      {t:"Reforma Agrară (1918\u20131921) și Partidele Politice",d:"Reforma agrară — cea mai amplă din Europa postbelică: circa 6.000.000 ha redistribuite la circa 1.500.000 de țărani. Votul universal (promis 1917 de Ferdinand I; consacrat în Constituția 1923) a transformat radical baza electorală. Principalele partide: PNL (Brătienilor — marea burghezie, politica «prin noi înșine»); PNȚ (Iuliu Maniu — țărănimea și mica burghezie; format 1926 prin fuziunea PN + PT); Averescan, Goga-Cuza (naționalist-creștin). «Formula regilor»: Regele numea guvernul, guvernul câștigea alegerile — disfuncție a sistemului politic românesc interbelic."},
    ]},
    {id:"extremism",icon:"\u26a0\ufe0f",title:"Extremismul Interbelic: Garda de Fier",short:"Codreanu, legionari, antisemitism, violența politică",content:[
      {t:"Legiunea Arhanghelului Mihail și Garda de Fier",d:"Legiunea Arhanghelului Mihail (fondată 1923 de Corneliu Zelea Codreanu — «Căpitanul», 1899\u20131938): cea mai importantă mișcare fascistă română. Ideologia: Naționalism radical + ortodoxism mistic + antisemitism + anticomunism. Organizare: «Cuiburi» de 3\u201313 membri, uniformă verde. Baza socială: studenți, intelectuali frustrați, mici burghezi. Violențele: Asasinarea ministrului Duca (1933), a prim-ministrului Armand Călinescu (21 sept. 1939). Alegerile din dec. 1937: GF obține 15,58% — a 3-a forță politică. Reprimarea de Carol II (1938): Codreanu strangulat la Jilava (29\u201330 nov. 1938). Statul Național-Legionar (6 sept. 1940 \u2013 ian. 1941): Antonescu + GF. Rebeliunea Legionară (21\u201323 ian. 1941): Pogroame București (120 evrei uciși); Antonescu lichidează GF."},
      {t:"Antisemitismul și Holocaustul",d:"1923 — LANC (A.C. Cuza) — partid antisemit explicit. 1938 — Decretul «revizuirii cetățeniei» (Carol II): circa 225.000 evrei depuși de cetățenie. 1940\u20131944 — «Legile rasiale»: restricții economice, excludere din profesii, steaua galbenă. Holocaustul în România (regimul Antonescu): circa 280.000\u2013380.000 de evrei (în principal Basarabia, Bucovina, Moldova) și circa 11.000\u201325.000 de romi uciși în pogromuri, deportări în Transnistria, lagăre. Raportul Comisiei Wiesel (2004) — recunoașterea oficială a Holocaustului de statul român."},
    ]},
    {id:"carol2",icon:"\ud83d\udc51",title:"Dictatura Regal\u0103 a lui Carol II (1938\u20131940)",short:"Constituția 1938, FRN, cedările teritoriale",content:[
      {t:"Instaurarea Dictaturii (10 Februarie 1938)",d:"Carol al II-lea (1893\u20131953) dizolvă Parlamentul și partidele politice la 10 febr. 1938. Constituția din 27 febr. 1938 (plebiscit: 4.289.581 pentru, 5.483 contra): Putere executivă concentrată la rege; garanțiile constituționale limitate; sistem corporatist. Frontul Renașterii Naționale (FRN, 1938\u20131940) — transformat în Partidul Națiunii (1940): singurul partid legal. Cedările teritoriale din 1940: Basarabia și N. Bucovinei (26\u201328 iun. 1940, URSS — ultimatum de 24 ore); N. Transilvania (30 aug. 1940, Arbitrajul de la Viena); Cadrilaterul (7 sept. 1940, Tratatul de la Craiova). La 4/6 sept. 1940, Carol al II-lea abdicǎ în favoarea fiului Mihai I."},
    ]},
    {id:"antonescu",icon:"\u2694\ufe0f",title:"Regimul Antonescu (1940\u20131944) și Al Doilea Război Mondial",short:"Barbarossa, Stalingrad, 23 august 1944",content:[
      {t:"Ion Antonescu — Conducătorul și Barbarossa",d:"Ion Antonescu (1882\u20131946) — «Conducătorul statului» din 6 sept. 1940. A gouvernat cu GF (sept. 1940 \u2013 ian. 1941), apoi solo după Rebeliunea Legionară (23 ian. 1941). Operațiunea Barbarossa (22 iun. 1941): România participă alături de Germania — motivația: recuperarea Basarabiei și Bucovinei. Armata română: circa 400.000 de osteni în prima fază. Campania 1941: Recuperarea Basarabiei și Bucovinei (26 iun.\u20134 aug. 1941). Bătălia de la Odessa (18 aug.\u201316 oct. 1941): circa 17.000 de morți români. Bătălia de la Stalingrad (nov. 1942 \u2013 febr. 1943): Armata a 3-a și a 4-a română flancau armata germană a 6-a; ofensiva sovietică «Uranus» (19\u201323 nov. 1942) a spart frontul românesc."},
      {t:"23 August 1944",d:"Contextul: Înfrângerile succesive ale Axei, avansul sovietic rapid, contacte secrete cu Aliații occidentali. Regele Mihai I arestează pe Antonescu la 23 august 1944. La 23 august 1944, ora 23, Regele Mihai I anunță la radio armistițiul cu Națiunile Unite și ieșirea din war. Importanța: (1) Armata română întoarce armele contra Germaniei (circa 538.000 de osteni pe frontul anti-german); (2) S-au redus cu circa 200 de zile durata razboiului în Europa (estimare Churchill); (3) România recăpătă N. Transilvaniei (Tratatul de la Paris, 1947). Ion Antonescu judecat și executat (1 iun. 1946)."},
    ]},
    {id:"cron6",icon:"\ud83d\udcdc",title:"Cronologie: Democrație și Totalitarism (1918\u20131947)",short:"Date verificate",content:[
      {t:"1918\u20131947: De la Unire la Comunism",d:"1918, 1 dec. — Marea Adunare de la Alba Iulia. 1919\u20131921 — Reforma agrară. 1920, 4 iun. — Tratatul de la Trianon. 1921 — Mica Înțelegere. 1922, oct. — Încoronarea la Alba Iulia. 1923, 29 mart. — Constituția democratică. 1923 — Codreanu fondează Legiunea Arhanghelului Mihail. 1926 — PNȚ (Maniu + Mihalache). 1933, 29 dec. — Asasinarea lui Duca de legionari. 1934 — Înțelegerea Balcanică. 1937, dec. — GF obține 15,58%. 1938, 10 febr. — Dictatura regală. 1938, 27 febr. — Constituția lui Carol II. 1938, 29\u201330 nov. — Asasinarea lui Codreanu la Jilava. 1939, 21 sept. — Asasinarea lui Călinescu. 1940, 26\u201328 iun. — Cedarea Basarabiei și N. Bucovinei. 1940, 30 aug. — Arbitrajul de la Viena (N. Transilvania). 1940, 6 sept. — Abdicarea lui Carol II; Antonescu — Conducătorul. 1941, 21\u201323 ian. — Rebeliunea Legionară. 1941, 22 iun. — Barbarossa; România alături de Germania. 1942\u20131943 — Armata română la Stalingrad. 1944, 23 aug. — Actul de la 23 August. 1946, 7 nov. — Alegeri fraudate. 1947, 30 dec. — Abdicarea Regelui Mihai I; RPR."},
    ]},

// ── PROGRES (aceleasi chei ca progres-test.html) ──────────────
window.__gbNarator=function(opts){
  var key=null; try{key=localStorage.getItem('gb_narator_key');}catch(e){}
  if(!key){
    key=window.prompt("Naratorul AI are nevoie de o cheie API Anthropic.\nSe salveaza DOAR pe acest dispozitiv, in browser.\n\nLasa gol ca sa renunti:");
    if(!key) return Promise.resolve({json:function(){return Promise.resolve({content:[{text:"Naratorul e dezactivat. Adauga o cheie API ca sa il folosesti."}]});}});
    key=key.trim(); try{localStorage.setItem('gb_narator_key',key);}catch(e){}
  }
  return fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true"},body:opts.body});
};
window.__gbStergeCheia=function(){try{localStorage.removeItem('gb_narator_key');}catch(e){}};
window.__gbChapter=null;
function gbLoad(k){try{return JSON.parse(localStorage.getItem(k)||'{}');}catch(e){return {};}}
function gbSave(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

var QUIZ=[{q:"Ce informații oferă 'Gesta Hungarorum' scrisă de Anonymus?",opts:["Întemeierea Dobrogei de Balica","Existența voievodatelor lui Gelu, Menumorut și Glad în sec. IX","Bătălia de la Posada (1330)","Descălecatul lui Bogdan din Maramureș"],a:1,ex:"Gesta Hungarorum (notarul Anonymus al regelui Bela al III-lea) menționează voievodatele lui Gelu (centrul Transilvaniei — reședința la Dăbâca), Menumorut (Crișana) și Glad (Banat) la sosirea ungurilor în Câmpia Panonică."},{q:"Ce a reprezentat Bătălia de la Posada (9-13 noiembrie 1330)?",opts:["Cucerirea Moldovei de Ungaria","Victoria lui Basarab I care a obținut independența Țării Românești","Prima bătălie a Moldovei cu turcii","Integrarea Dobrogei în Imperiul Otoman"],a:1,ex:"Basarab I a zdrobit armata regelui Carol Robert de Anjou într-un defileu montan. Evenimentul este menționat în Cronica pictată de la Viena. Această victorie marchează obținerea independenței Țării Românești față de Ungaria."},{q:"Ce a stabilit Unio Trium Nationum (1437)?",opts:["Unirea celor trei principate românești","Alianța maghiarilor, sașilor și secuilor care excludea românii de la viața politică","Tratatul dintre Moldova, Ungaria și Polonia","Desființarea voievodatului Transilvaniei"],a:1,ex:"1437: alianță politică între maghiari, sași și secui — 'națiunile' privilegiate. Românii, deși majoritari, erau excluși complet de la viața politică. Situația s-a menținut prin Tripartitum-ul lui Werboczi (sec. XVI)."},{q:"Ce înseamnă 'Io' din titulatura domnilor Moldovei și Țării Românești?",opts:["Cel mai mare conducător militar","Ales de popor prin vot","De la Ioannes (greacă) = cel ales de Dumnezeu","Titlu moștenit din Imperiul Roman"],a:2,ex:"'Io' provine din grecescul Ioannes și semnifică un ales al lui Dumnezeu. Alături de 'din mila lui Dumnezeu', exprima originea divină a puterii — tradiție pe filieră bizantin-ortodoxă moștenită prin intermediul slavilor."},{q:"Cine a realizat al doilea descălecat al Moldovei și de unde a venit?",opts:["Dragoș din Bedeu, Maramureș","Petru I Mușat din Suceava","Bogdan din Cuhea (Maramureș)","Lațcu din Siret"],a:2,ex:"Bogdan din Cuhea (Maramureș) s-a răsculat împotriva urmașilor lui Dragoș (Sas și Balc), a trecut Carpații în 1359-1360 și a smuls Moldova din sfera maghiară. În 1365 a luptat și a câștigat independența față de Ungaria."},{q:"Care era cel mai important dregător în Țara Românească?",opts:["Logofătul — șeful Cancelariei Domnești","Spătarul — comandantul cavaleriei","Banul — exercita funcțiile domnului în Oltenia","Stolnicul — pregătea masa domnitorului"],a:2,ex:"Banul era cel mai important dregător în Țara Românească, exercitând funcțiile domnului în Oltenia. Echivalentul în Moldova era Portarul (coordonatorul cetății de scaun de la Suceava)."},{q:"Când a început domnia fanariotă și prin ce s-a caracterizat?",opts:["1682 — domni numiți direct de Veneția","1711 (Moldova) și 1716 (Țara Românească) — greci din Fanar, Constantinopol","1700 — domni numiți de Habsburg","1750 — generalizarea tributului față de Poartă"],a:1,ex:"Fanarioții (greci din cartierul Fanar al Constantinopolului) au înlocuit domnii pâmânteni. Ultimii domni pâmânteni: Constantin Brâncoveanu (Țara Românească) și Dimitrie Cantemir (Moldova). Moldova intră sub regim fanariot în 1711, Țara Românească în 1716. S-a revenit la domni pâmânteni în 1822, după Revoluția lui Tudor Vladimirescu."},{q:"Ce a stabilit Diploma Leopoldină (1691) privind Transilvania?",opts:["Unirea Transilvaniei cu Ungaria","Termenii ocupației habsburgice, menținând privilegiile Unio Trium Nationum","Desființarea imediată a principatului autonom","Recunoașterea ortodoxiei ca religie receptă"],a:1,ex:"Diploma Leopoldină (împăratul Leopold I, 1691) stabilea condițiile ocupației habsburgice. Inițial, privilegiații rămâneau Unio Trium Nationum. În 1701, o nouă diplomă a dus la întemeierea Bisericii Greco-Catolice — soluție de compromis aparținând Papei."}];function QuizView(){var _useState39=useState(0),_useState40=_slicedToArray     {id:"bobalna",t:"R\u0103scoala de la Bob\u00e2lna (1437)",ic:"\u2694\ufe0f",p:"6 iulie 1437",d:"R\u0103scoala de la Bob\u00e2lna (jud. Cluj) a izbucnit \u00een vara anului 1437, provocat\u0103 de politica fiscal\u0103 excesiv\u0103 a episcopului Gheorghe Lep\u0113s (cere plata dijmelor \u00een bani, nu \u00een natur\u0103) \u015fi de asupririle feudale ale nobilimii. O armat\u0103 \u021b\u0103r\u0103neasc\u0103 format\u0103 din \u021b\u0103rani rom\u00e2ni \u015fi maghiari, condus\u0103 de Antal Nagy din Buda, ocup\u0103 col\u0107ile feudale \u015fi \u00eench\u00e2ie cu nobilimea Conven\u021bia de la Bob\u00e2lna (16 iulie 1437), care prevedea: reducerea obligatorie a dijmelor, dreptul \u021b\u0103ranilor de a se muta liber, abolirea unor taxe ilegale. Reac\u021bia feudalit\u0103\u021bii: Nobilimea maghiar\u0103, s\u0103\u015fii \u015fi secuii au \u00eencheiat Unio Trium Nationum (16 septembrie 1437) tocmai \u00een r\u0103spuns la aceast\u0103 r\u0103scoal\u0103, pentru a ap\u0103ra privilegiile celor trei na\u021biuni privilegiate. R\u0103scoala a fost \u00een final \u00een\u0103bu\u015fit\u0103 (sept.\u2013oct. 1437, prin lupta de la Bob\u00e2lna \u015fi tratativele de la Cluj-M\u0103n\u0103\u015ftur). Semnifica\u021bie: Unio Trium Nationum \u2014 pactul care a exclus rom\u00e2nii din via\u021ba politic\u0103 transilvane pentru secole \u2014 a ap\u0103rut direct \u00een contextul acestei r\u0103scoale.",tg:["Bob\u00e2lna","1437","R\u0103scoa l\u0103 \u021b\u0103r\u0103neasc\u0103","Unio Trium Nationum","Esen\u021bial BAC"]},
    {id:"capalna",t:"R\u0103scoala de la C\u0103p\u00e2lna (1438)",ic:"\u2761",p:"1438",d:"Dup\u0103 \u00een\u0103bu\u015firea r\u0103scoalei de la Bob\u00e2lna (toamna 1437), o parte a \u021b\u0103ranilor r\u0103sculat\u021bi s-au reorganizat \u015fi au reluat lupta. R\u0103scoala de la C\u0103p\u00e2lna (c. 1438, jud. Alba) a reprezentat a doua faz\u0103 a mi\u015fc\u0103rii din 1437\u20131438, condus\u0103 de Antal Nagy din Buda \u015fi de ali\u021bi conduc\u0103tori. Nobilimea maghiar\u0103, \u00een aplicarea Unio Trium Nationum, a ripostat cu for\u021ba armat\u0103 \u015fi a reprimat definitiv mi\u015fcarea. Importan\u021ba: Cele dou\u0103 r\u0103scoale au condus la \u00een\u0103sprirea regimului iob\u0103g\u0103sc: Dieta de la Pesta (toamna 1437) a decis m\u0103suri puni tive grave \u2014 incluzi\u00e2nd legarea definitiv\u0103 de glie \u015fi abolirea dreptului de liber\u0103 mutare al \u021b\u0103ranilor, consacrat prin Codul lui Tripartitum (1517).",tg:["C\u0103p\u00e2lna","1438","R\u0103scoal\u0103","Iob\u0103gie","Tripartitum"]},
    {id:"tripartit",t:"Tripartitum-ul lui Werb\u0151czy (1517) \u2014 Codul Iob\u0103giei",ic:"\u2696\ufe0f",p:"1517",d:"Tripartitum (titlul complet: Opus Tripartitum Juris Consuetudinarii Inclyti Regni Hungariae) a fost redactat de nobilul maghiar Istv\u00e1n Werb\u0151czy (1458\u20131541) \u015fi publicat \u00een 1517. Acesta codifica legile cutumiare ale Regatului Ungar \u015fi consacra: (1) Egalitatea juridic\u0103 a nobili mii maghiare (indiferent de avere) \u2014 to\u021bi nobilii erau egali \u00een fa\u021ba legii; (2) Dreptul nobil mii de a rezista regelui (ius resistendi) \u00een cazul \u00eenc\u0103lc\u0103rii privilegiilor; (3) Iob\u0103gia definitiv\u0103: \u021b\u0103ranii erau lega\u021bi permanent de glie, f\u0103r\u0103 dreptul de a se muta liber (excep\u021bii minime); (4) Rom\u00e2nii nu aveau personalitate juridic\u0103 proprie \u2014 nu erau recuno\u015fcu\u021bi ca na\u021biune politic\u0103. Importan\u021ba pentru BAC: Tripartitum-ul a consolidat sistemul Unio Trium Nationum (1437), men\u021bin\u00e2nd rom\u00e2nii \u00een afara vie\u021bii politice din Transilvania \u015fi consacr\u00e2nd iob\u0103gia ca statut juridic definitiv. A r\u0103mas dreptul cutumiar al Transilvaniei p\u00e2n\u0103 \u00een sec. XIX.",tg:["Werb\u0151czy","Tripartitum","1517","Iob\u0103gie","Nobilime","Esen\u021bial BAC"]},
    {id:"rascoala1562",t:"R\u0103scoala Secuilor din 1562",ic:"\u2694\ufe0f",p:"1562",d:"R\u0103scoala secuilor din 1562 a izbucnit \u00een contextul politicii centralizatoare a Principatului Transilvaniei sub Ioan Sigismund Z\u00e1poly ai (sprijinit de regent Gheorghe Martinuzzi, apoi de John Sigismund). Secuii, care beneficiau de statut militar privilegiat (scutitura de iob\u0103gie \u00een schimbul serviciului militar), au protestat \u00eempotriva tentativelor de a le impune iob\u0103gia \u015fi de a le reduce privilegiile. Conduc\u0103torii r\u0103scoalei au exploatat nemul\u021bumirile fa\u021b\u0103 de excesul de impozite \u015fi de c\u0103l carea statutelor lor. R\u0103scoala a fost reprimat\u0103 de voievodul Transilvaniei \u015eutefan B\u00e1thory (1533\u20131534, dar activ \u00een repr imarea din 1562). Consecin\u021be: (1) Privilegiile militare ale secuilor au fost reduse; (2) O parte din secui au fost iob\u0103gi\u021bi temporar (st\u0103tut revocat ulterior); (3) Organizarea scaunelor secuie\u015fti a suferit modific\u0103ri. Semnifica\u021bie \u00een contextul Unio Trium Nationum: Chiar una din cele trei na\u021biuni privilegiate (secuii) a protestat \u00eempotriva abuzurilor \u2014 dovad\u0103 a tensiunilor interne persistente din Transilvania medieval\u0103.",tg:["1562","Secui","R\u0103scoal\u0103","\u0218tefan B\u00e1thory","Principat Transilvaniei"]}];return React.createElement("div",{style:{padding:"24px 16px",maxWidth:820,margin:"0 auto"}},React.createElement("div",{style:{marginBottom:20}},React.createElement("div",{style:{fontFamily:"'Cinzel',serif",fontSize:"0.58rem",letterSpacing:"0.3em",color:A2,marginBottom:8,opacity:0.7}},"SURSE ISTORICE PRIMARE \u00b7 PENTRU A \u00cele\u0218ELEGE MAI MULT"),React.createElement("h2",{style:{fontFamily:"'Cinzel',serif",fontSize:"1.3rem",fontWeight:700,color:"#F0E8D8",marginBottom:8}},"Izvoare Istorice Esen\u021biale"),React.createElement("p",{style:{fontFamily:"'EB Garamond',serif",fontSize:"0.95rem",color:
